<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Para el celular y la tableta: se puede «Añadir a pantalla de inicio» y abre como una aplicación. -->
<meta name="theme-color" content="#05070b">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M-Jarvis">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="preload" href="fuentes/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fuentes/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vidrio.css">
<link rel="apple-touch-icon" href="icono-180.png">
<title>M-Jarvis</title>
<style>
  /* Tipografías propias, sin internet: Newsreader es la voz de Jarvis; Instrument Sans, la interfaz. */
  @font-face { font-family: "Newsreader Variable"; font-style: normal; font-weight: 200 800; font-display: swap;
    src: url(fuentes/newsreader-latin-opsz-normal.woff2) format("woff2-variations"); }
  @font-face { font-family: "Newsreader Variable"; font-style: italic; font-weight: 200 800; font-display: swap;
    src: url(fuentes/newsreader-latin-opsz-italic.woff2) format("woff2-variations"); }
  @font-face { font-family: "Instrument Sans Variable"; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url(fuentes/instrument-sans-latin-wght-normal.woff2) format("woff2-variations"); }

  :root {
    /* Un escenario casi negro con tinte azul: la sala del evento es luminosa y ruidosa, y la bola es lo único que brilla. */
    --tinta: #05070b; --tinta-2: #0b1019; --texto: #eaeef5; --tenue: #98a2b3; --apagado: #7c8798;
    --cristal: rgba(14, 19, 29, .72); --linea: rgba(255, 255, 255, .11); --velo: rgba(255, 255, 255, .06);
    --animo: #6aa9ff;           /* el color del ánimo con que habla (lo cambia el script) */
    --alerta: #ff7a6b;
    --voz-serif: "Newsreader Variable", "Newsreader", Georgia, "Times New Roman", serif;
    --voz-sans: "Instrument Sans Variable", "Instrument Sans", system-ui, "Segoe UI", sans-serif;
    --salida: cubic-bezier(.16, 1, .3, 1);   /* exponencial: arranca rápido y se asienta */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--tinta); color: var(--texto); font-family: var(--voz-sans); }
  body { display: flex; }
  ::selection { background: color-mix(in oklab, var(--animo) 40%, transparent); color: #fff; }
  :focus-visible { outline: 2px solid color-mix(in oklab, var(--animo) 70%, #fff); outline-offset: 3px; }

  main { flex: 1; min-width: 0; min-height: 0; display: flex; }
  #mapa { flex: 1; min-width: 0; border: 0; background: var(--tinta); }

  /* ---------- La escena: bola arriba, conversación abajo ---------- */
  #charla {
    --D: clamp(150px, min(62cqw, 37cqh), 440px);         /* diámetro de la bola */
    --arriba: clamp(10px, 3.2cqh, 34px);
    --zona-orbe: calc(var(--D) + var(--arriba) + clamp(14px, 3cqh, 30px));
    --margen: clamp(16px, 4cqw, 44px);
    --alto-form: 76px;
    position: relative; flex: 0 0 clamp(340px, 30vw, 560px); container-type: size; overflow: hidden; isolation: isolate;
    background: radial-gradient(130% 62% at 50% -8%, color-mix(in oklab, var(--animo) 13%, transparent), transparent 62%), var(--tinta);
    border-left: 1px solid var(--linea);
    transition: background .8s var(--salida);
  }
  body.solo-chat #charla { flex: 1; border-left: 0; }
  /* Con la interfaz completa la escena es transparente: detrás va el ambiente de color, que el cristal refracta. */
  body.con-dock #charla { background: radial-gradient(130% 62% at 50% -8%, color-mix(in oklab, var(--animo) 13%, transparent), transparent 62%); }

  /* La conversación ocupa toda la escena: el texto sube por detrás de la bola. */
  #mensajes {
    position: absolute; inset: 0; z-index: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
    display: flex; flex-direction: column;
    padding: var(--zona-orbe) var(--margen) calc(var(--alto-form) + env(safe-area-inset-bottom, 0px) + 28px + var(--alto-dock) + var(--aire-dock));
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, rgba(0, 0, 0, .18) calc(var(--zona-orbe) * .5), #000 calc(var(--zona-orbe) * 1.25));
            mask-image: linear-gradient(to bottom, transparent 0, rgba(0, 0, 0, .18) calc(var(--zona-orbe) * .5), #000 calc(var(--zona-orbe) * 1.25));
  }
  #mensajes::-webkit-scrollbar { display: none; }
  .hilo { margin: auto auto 0; width: min(100%, 860px); display: flex; flex-direction: column; gap: clamp(14px, 2.4cqh, 26px); }

  /* El velo: capas de desenfoque que crece hacia arriba. Es lo que hace que lo viejo se "aleje" al pasar tras la bola. */
  #velo { position: absolute; inset: 0 0 auto 0; z-index: 2; height: calc(var(--zona-orbe) * 1.75); pointer-events: none; }
  #velo i { position: absolute; inset: 0; }

  #cuerpo { position: absolute; z-index: 3; left: 50%; top: calc(var(--arriba) + var(--D) / 2); width: calc(var(--D) * 1.9); aspect-ratio: 1;
    transform: translate(-50%, -50%); pointer-events: none; }
  #orbe { width: 100%; height: 100%; display: block; }
  /* Sin WebGL, una bola de CSS hace el papel (menos rica, igual de viva). */
  #orbe-css { display: none; position: absolute; inset: 26.3%; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fff 0, color-mix(in oklab, var(--animo) 80%, #fff) 14%, var(--animo) 42%, color-mix(in oklab, var(--animo) 25%, #000) 100%);
    animation: respira 5s ease-in-out infinite; }
  #cuerpo.sin-gl #orbe { display: none; } #cuerpo.sin-gl #orbe-css { display: block; }
  @keyframes respira { 50% { transform: scale(1.045); } }

  /* ---------- Barra superior (encima de todo, sobre la bola) ---------- */
  #barra { position: absolute; z-index: 5; inset: max(10px, env(safe-area-inset-top)) var(--margen) auto; display: flex; align-items: center; gap: 12px; pointer-events: none; }
  #barra > * { pointer-events: auto; }
  #marca { font-weight: 600; font-size: .74rem; letter-spacing: .28em; color: var(--tenue); white-space: nowrap; }
  #estado { display: flex; align-items: center; gap: 8px; color: var(--apagado); font-size: .8rem; letter-spacing: .02em; }
  #estado i { width: 7px; height: 7px; border-radius: 50%; background: var(--animo); transition: background .6s; }
  #estado.vivo i { animation: latido 1.2s ease-in-out infinite; }
  @keyframes latido { 50% { opacity: .3; transform: scale(.7); } }
  #acciones { margin-left: auto; display: flex; gap: 8px; }

  .boton-icono { width: 42px; height: 42px; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 1px solid var(--linea);
    background: var(--cristal); color: var(--tenue); cursor: pointer; transition: color .2s, border-color .2s, background .2s, transform .2s var(--salida); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  body.con-dock .boton-icono { border: 0; background: linear-gradient(150deg, rgba(255, 255, 255, .17), rgba(255, 255, 255, .06)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
  .boton-icono:hover { color: var(--texto); border-color: rgba(255, 255, 255, .24); }
  .boton-icono:active { transform: scale(.94); }
  .boton-icono[aria-pressed="true"] { color: var(--texto); border-color: color-mix(in oklab, var(--animo) 60%, transparent); background: color-mix(in oklab, var(--animo) 16%, var(--cristal)); }
  .boton-icono svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #verRed { display: none; }
  .tachada { display: none; } #voz[aria-pressed="false"] .tachada { display: block; } #voz[aria-pressed="false"] .onda { display: none; }

  /* ---------- Mensajes ---------- */
  .msg { max-width: 100%; overflow-wrap: anywhere; animation: sube .4s var(--salida) both; }
  @keyframes sube { from { opacity: 0; transform: translateY(14px); } }
  .msg p { margin: 0; white-space: pre-wrap; }
  .yo { align-self: flex-end; max-width: min(84%, 620px); padding: .62em 1.05em; border-radius: 1.3em 1.3em .35em 1.3em; background: var(--velo);
    border: 1px solid var(--linea); color: var(--texto); font-size: clamp(.95rem, .62vw + .78rem, 1.18rem); line-height: 1.4; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16); }
  /* La voz de Jarvis: serif a buen tamaño (se lee de pie, a un metro de la pantalla). El ánimo se ve en la bola y en un punto del color. */
  .jarvis { position: relative; align-self: flex-start; padding-left: 1.15em; font-family: var(--voz-serif); font-optical-sizing: auto;
    font-size: clamp(1.18rem, 1.1vw + .9rem, 1.9rem); line-height: 1.42; font-weight: 400; letter-spacing: .005em; max-width: 62ch; text-wrap: pretty; }
  .jarvis::before { content: ""; position: absolute; left: 0; top: .62em; width: .42em; height: .42em; border-radius: 50%; background: var(--animo-msg, var(--apagado)); transition: background .4s; }
  .jarvis.esperando p { color: var(--tenue); font-style: italic; }
  .fuente { display: block; margin-top: .6em; font: 400 .74rem/1.3 var(--voz-sans); color: var(--apagado); letter-spacing: .02em; }
  .fuente b { font-weight: 600; color: var(--tenue); }

  /* Antes de la primera pregunta: tres invitaciones, para quien no sabe por dónde empezar. */
  #sugerencias { align-self: flex-start; display: flex; flex-direction: column; align-items: flex-start; gap: .1em; padding-left: 1.15em; margin-bottom: clamp(8px, 2cqh, 20px); }
  /* Lo primero que ve quien llega: las invitaciones aparecen una tras otra, y es la única vez que la escena hace entrada. */
  #sugerencias > * { animation: sube .5s var(--salida) both; animation-delay: .2s; }
  #sugerencias > :nth-child(2) { animation-delay: .28s; } #sugerencias > :nth-child(3) { animation-delay: .34s; } #sugerencias > :nth-child(4) { animation-delay: .4s; } #sugerencias > :nth-child(5) { animation-delay: .46s; }
  #sugerencias small { font: 500 .72rem var(--voz-sans); letter-spacing: .22em; text-transform: uppercase; color: var(--apagado); margin-bottom: .5em; }
  #sugerencias button { all: unset; cursor: pointer; font: italic 400 clamp(1.1rem, .9vw + .85rem, 1.6rem)/1.35 var(--voz-serif); color: var(--tenue); padding: .12em 0; border-bottom: 1px solid transparent; transition: color .2s, border-color .2s; }
  #sugerencias button:hover { color: var(--texto); border-color: color-mix(in oklab, var(--animo) 60%, transparent); }
  #sugerencias button:focus-visible { outline: 2px solid color-mix(in oklab, var(--animo) 70%, #fff); outline-offset: 3px; border-radius: 3px; }

  /* ---------- Entrada ---------- */
  #formulario { position: absolute; z-index: 5; left: 50%; bottom: calc(max(14px, env(safe-area-inset-bottom)) + var(--alto-dock) + var(--aire-dock)); transform: translateX(-50%);
    width: min(calc(100% - 2 * var(--margen)), 860px); height: var(--alto-form); padding: 14px; display: flex; align-items: center; gap: 10px;
    border-radius: 999px; }
  #campo { flex: 1; min-width: 0; height: 100%; padding: 0 6px; background: transparent; border: 0; color: var(--texto); font: 400 clamp(1rem, .5vw + .85rem, 1.2rem) var(--voz-sans); }
  #campo::placeholder { color: var(--apagado); }
  #campo:focus-visible { outline: none; }
  #formulario:focus-within { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 0 0 2px color-mix(in oklab, var(--animo) 55%, transparent), 0 22px 44px -16px rgba(0, 0, 0, .65); }
  #mic { position: relative; flex: none; width: 48px; height: 48px; }
  #mic.oyendo { color: #fff; background: color-mix(in oklab, var(--animo) 70%, #000); border-color: transparent; }
  /* El anillo del micrófono crece con la voz de quien habla. */
  #mic.oyendo::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--animo);
    transform: scale(var(--nivel-mic, 1)); opacity: calc(var(--nivel-mic, 1) - .6); transition: transform .08s linear, opacity .08s linear; }
  #mic.procesando svg { animation: gira 1.1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  #enviar, #parar { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; padding: 0;
    background: color-mix(in oklab, var(--animo) 85%, #fff 10%); color: #05070b; transition: transform .2s var(--salida), filter .2s; }
  #enviar:hover, #parar:hover { filter: brightness(1.12); } #enviar:active, #parar:active { transform: scale(.93); }
  #parar { background: var(--alerta); }
  /* Pantalla bloqueada desde el Manager: se ve y se escucha, pero no acepta preguntas. */
  #formulario.bloqueado { opacity: .38; pointer-events: none; }
  #enviar svg, #parar svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Celular y tableta en vertical: primero la conversación, a toda la pantalla. La red neuronal se abre con su botón
     (y no se carga hasta entonces: así el teléfono no trabaja de más). */
  @media (max-width: 820px) {
    body { height: 100dvh; }
    main { flex-direction: column; }
    #verRed { display: grid; }   /* .boton-icono mandaba más: aquí se muestra solo en pantallas estrechas */
    #mapa { display: none; flex: none; height: 46%; }
    body.con-red #mapa { display: block; }
    #charla { flex: 1; border-left: 0; --D: clamp(120px, min(54cqw, 27cqh), 300px); --alto-form: 66px; --arriba: clamp(58px, 9cqh, 84px); --margen: 16px; }
    #marca { letter-spacing: .2em; }
    body.con-red #charla { border-top: 1px solid var(--linea); }
    #formulario { padding: 9px; } #mic, #enviar, #parar { width: 44px; height: 44px; }
    #campo { font-size: 1rem; }   /* con 16 px el iPhone no hace zoom al escribir */
  }
  @media (prefers-reduced-motion: reduce) {
    .msg, #sugerencias > * { animation: fundido .2s ease both; animation-delay: 0s; } #estado.vivo i, #orbe-css { animation: none; } #mic.procesando svg { animation-duration: 3s; }
  }
</style>
</head>
<body>
<div id="ambiente" aria-hidden="true"><i></i><i></i></div>
<main>
  <iframe id="mapa" data-src="grafo/?embebido=1" title="Mapa de conocimiento"></iframe>
  <section id="charla" aria-label="Conversación con M-Jarvis">
    <div id="velo" aria-hidden="true"></div>
    <div id="cuerpo" aria-hidden="true"><canvas id="orbe"></canvas><div id="orbe-css"></div></div>
    <div id="barra">
      <span id="marca">M-JARVIS</span>
      <div id="estado" role="status"><i></i><span>En espera</span></div>
      <div id="acciones">
        <button id="verRed" class="boton-icono" type="button" aria-pressed="false" aria-label="Ver la red neuronal" title="Red neuronal">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7.9 8.2l3 7.8M16.2 7.4l-3 8.6M8.2 7h7.6"/></svg>
        </button>
        <button id="voz" class="boton-icono" type="button" aria-pressed="true" aria-label="Voz de Jarvis" title="Voz de Jarvis" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path class="onda" d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/><path class="tachada" d="M16 9.5l5 5m0-5l-5 5"/></svg>
        </button>
      </div>
    </div>
    <div id="mensajes" role="log" aria-live="polite" aria-relevant="additions text"><div class="hilo" id="hilo">
      <div id="sugerencias"><small>Pruebe a preguntar</small>
        <button type="button">¿Quién es Thanos?</button><button type="button">¿Qué son las Gemas del Infinito?</button><button type="button">Hábleme de Iron Man</button><button type="button">¿Cómo funciona su cerebro?</button>
      </div></div></div>
    <form id="formulario" class="vidrio" autocomplete="off">
      <button id="mic" class="boton-icono" type="button" aria-label="Hablar con Jarvis" title="Hablar con Jarvis" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
      </button>
      <input id="campo" autocomplete="off" enterkeyhint="send" placeholder="Pregúntele algo a Jarvis…" aria-label="Pregunta" autofocus>
      <button id="enviar" type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      <button id="parar" type="button" aria-label="Detener la respuesta" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg></button>
    </form>
  </section>
</main>
<section id="hoja" class="vidrio" hidden aria-labelledby="hoja-titulo">
  <header id="hoja-cabeza"><h1 id="hoja-titulo"></h1><div class="derecha" id="hoja-derecha"></div></header>
  <div id="hoja-cuerpo"></div>
</section>
<nav id="dock" class="vidrio" aria-label="Secciones"><i id="lente"></i></nav>
<script>
const $ = id => document.getElementById(id);
const mapa = $('mapa'), mensajes = $('mensajes'), hilo = $('hilo'), campo = $('campo'), charla = $('charla');
const estado = $('estado'), botonVoz = $('voz'), botonMic = $('mic'), parar = $('parar');
const guardado = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch (e) { return null; } };

// ---------------------------------------------------------------------------------------------------------------
// Los ánimos: el color de cada uno (los mismos nombres que sus nodos en la bola de M-Jarvis del mapa)
// ---------------------------------------------------------------------------------------------------------------
const ANIMOS = { 'Serenidad': '#6aa9ff', 'Orgullo': '#e6d84a', 'Afecto': '#f472d0', 'Diversión': '#5fd38d',
  'Curiosidad': '#4fd1c5', 'Entusiasmo': '#f5a623', 'Fastidio': '#ff7a6b', 'Celos': '#9ad14b', 'Indignación': '#ff4d4d',
  'Preocupación': '#b48cf2', 'Melancolía': '#7f8fb5', 'Desconcierto': '#a3b1c2' };
const SERENO = ANIMOS['Serenidad'];

// ---------------------------------------------------------------------------------------------------------------
// El cuerpo: una bola de plasma en WebGL. Estados: espera, escucha, piensa, habla. Cambia de color con el ánimo.
// ---------------------------------------------------------------------------------------------------------------
const hexARgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
function rotarTono(rgb, grados) {  // un segundo color emparentado, para dar profundidad al plasma
  const [r, g, b] = rgb, mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = d === 0 ? 0 : mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  h = (h * 60 + grados + 360) % 360; const l = (mx + mn) / 2, s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  const t = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][Math.floor(h / 60) % 6];
  return t.map(v => v + m);
}
const VERTICE = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FRAGMENTO = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes; uniform float uT; uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uC3;
uniform float uNivel; uniform float uEsc; uniform float uPie; uniform float uHab;
float h31(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float n3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 p){ float a = .5, s = 0.; for (int i = 0; i < 4; i++){ s += a * n3(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= .5; } return s; }
void main(){
  vec2 uv = (gl_FragCoord.xy - .5 * uRes) / (.5 * uRes.y);
  float R = .526 * (1. + .028 * uNivel + .01 * sin(uT * 1.1));
  float r = length(uv);
  float dentro = smoothstep(R + .004, R - .004, r);
  vec3 col = vec3(0.);
  if (r < R + .01) {
    vec2 p = uv / R; float z = sqrt(max(1. - dot(p, p), 0.)); vec3 n = vec3(p, z);
    float ang = uT * (.05 + .05 * uPie + .035 * uHab); float cs = cos(ang), sn = sin(ang);
    vec3 s = vec3(cs * n.x + sn * n.z, n.y, -sn * n.x + cs * n.z);
    float e = .3 + .7 * uNivel + .45 * uPie;
    float base = fbm(s * 1.7 + vec3(0., uT * .045, 0.));

const PENSANDO = {
  inicio: ['Hmm, deme un momento…', 'Un momento…', 'Permítame un instante…', 'Déjeme ver…'],
  documentos: ['Déjeme consultar mis archivos…', 'Veamos qué tengo sobre {tema}…', 'Revisando mis notas sobre {tema}…',
    'Ah, {tema}. Deme un segundo para ordenar las ideas…', 'Conectando los datos…', 'Ya casi lo tengo…',
    'Atando cabos…'],
  general: ['Hmm, eso no figura en mis archivos; déjeme pensar…', 'Déjeme informarme…',
    'Recurriendo a mi cultura general…', 'Un instante más…', 'Hurgando en la memoria…'],
};
const barajar = lista => [...lista].sort(() => Math.random() - 0.5);

// Va cambiando la frase de espera hasta que llega la primera palabra de la respuesta. Si la espera es larga, la dice en voz alta (una vez).
function relleno(p) {
  let lista = barajar(PENSANDO.inicio), i = 0, tema = '', reloj = 0, vivoR = true, dicha = false;
  const poner = () => { if (vivoR) p.textContent = lista[i++ % lista.length].replace('{tema}', tema); };
  const cada = ms => { clearTimeout(reloj); reloj = setTimeout(() => { poner(); cada(2800); }, ms); };
  poner(); cada(2800);
  const aviso = setTimeout(() => { if (vivoR && !dicha) { dicha = true; Voz.decir(p.textContent); } }, 3200);
  return {
    ruta(fuente, nodos) {
      if (!PENSANDO[fuente]) return;
      tema = nodos[0] || '';
      lista = barajar(PENSANDO[fuente].filter(f => tema || !f.includes('{tema}'))); i = 0; cada(1300);
    },
    parar() { vivoR = false; clearTimeout(reloj); clearTimeout(aviso); },
  };
}

async function preguntar(pregunta) {
  burbuja('yo', pregunta);
  const caja = burbuja('jarvis esperando', '…'), p = caja.firstChild, habla = Habla();
  let primera = true, fuente = null, nodos = [], espera = null, terminada = false;
  ocupar(+1);
  // El mapa no se maneja desde aquí: sigue la conversación por su cuenta (vale igual para el mapa
  // de esta página que para el de una segunda pantalla).
  const manejar = d => {
    // Si Jarvis está con otra pregunta, esta espera su turno en la cola y se responde después.
    if (d.tipo === 'cola') p.textContent = d.puesto === 1 ? 'En cola: la respondo en cuanto termine la anterior.' : `En cola: hay ${d.puesto} preguntas antes.`;
    else if (d.tipo === 'turno') { vivo.piensa = true; espera = relleno(p); }
    else if (d.tipo === 'inicio') {
      fuente = d.fuente; nodos = d.nodos; if (espera) espera.ruta(fuente, nodos);
      if (ANIMOS[d.emocion]) { animoActual = ANIMOS[d.emocion]; caja.style.setProperty('--animo-msg', animoActual); caja.title = 'Ánimo: ' + d.emocion.toLowerCase(); }
    }
    else if (d.tipo === 'texto') {
      if (primera) { primera = false; if (espera) espera.parar(); p.textContent = ''; caja.classList.remove('esperando'); vivo.texto = true; }
      p.textContent += d.t; pulsoTexto = Math.min(1, pulsoTexto + .35); abajo(); habla.poner(d.t);
    } else if (d.tipo === 'fin') {
      terminada = true; habla.cerrar();
      if (SIN_NOTA.includes(fuente)) return;
      const nota = document.createElement('small'); nota.className = 'fuente';
      nota.textContent = (fuente === 'documentos' ? 'De mis archivos: ' + nodos.join(', ')
        : fuente === 'memoria' ? 'De esta conversación'
        : 'Conocimiento general, sin documento de respaldo') + ` · ${d.segundos} s` + (d.detenida ? ' · detenida' : '');
      caja.append(nota); abajo(true);
    }
  };
  try {
    const r = await fetch('api/preguntar', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pregunta, nueva, cliente }) });
    nueva = false;
    if (!r.ok) throw new Error(r.status);
    const lector = r.body.getReader(), dec = new TextDecoder();
    let resto = '';
    for (;;) {
      const { done, value } = await lector.read();
      if (done) break;
      resto += dec.decode(value, { stream: true });
      let corte;
      while ((corte = resto.indexOf('\n')) >= 0) { manejar(JSON.parse(resto.slice(0, corte))); resto = resto.slice(corte + 1); }
    }
    // Si la conexión se cortó a medias (por ejemplo, el servidor se reinició), que no quede colgada.
    if (!terminada) throw new Error('respuesta incompleta');
  } catch (e) {
    if (espera) espera.parar();
    caja.classList.remove('esperando');
    p.textContent = primera ? 'Perdí el hilo de esa pregunta: mi sistema se reinició a medias. ¿Me la repite?'
      : p.textContent + ' … (se cortó la conexión)';
  }
  if (espera) espera.parar();
  vivo.piensa = false; vivo.texto = false; ocupar(-1); campo.focus();
}

// Cuántas preguntas de esta pantalla están en curso o en cola. Mientras haya alguna se ve «Detener»,
// que corta la respuesta que se está dando (también con la tecla Esc); las que esperan siguen su turno.
let pendientes = 0;
function ocupar(cambio) {
  pendientes += cambio; parar.hidden = pendientes === 0;
}
function detener() { Voz.callar(); if (Oido.grabando) { Oido.parar(); } if (pendientes) fetch('api/detener', { method: 'POST' }).catch(() => {}); }
parar.addEventListener('click', detener);
addEventListener('keydown', e => { if (e.key === 'Escape') detener(); });

$('sugerencias').addEventListener('click', e => { if (e.target.tagName === 'BUTTON') { Voz.callar(); preguntar(e.target.textContent); } });
$('formulario').addEventListener('submit', e => {
  e.preventDefault();
  const pregunta = campo.value.trim();
  if (!pregunta) return;
  campo.value = ''; Voz.callar();
  preguntar(pregunta);
});
// ---------------------------------------------------------------------------------------------------------------
// El Manager: otro dispositivo manda órdenes a escondidas. Solo las obedece la pantalla del propio equipo (localhost),
// que es la que está a la vista del público; los celulares de la gente no.
// ---------------------------------------------------------------------------------------------------------------
let silenciado = false, bloqueado = false;
const esPantalla = ['localhost', '127.0.0.1'].includes(location.hostname);
function aplicarExhibicion(e) {
  silenciado = !!e.silencio; bloqueado = !!e.bloqueado;
  if (silenciado) Voz.callar();
  $('formulario').classList.toggle('bloqueado', bloqueado); campo.disabled = bloqueado;
  campo.placeholder = bloqueado ? 'Pantalla en exhibición' : 'Pregúntele algo a Jarvis…';
  const sug = $('sugerencias'); if (sug) sug.hidden = bloqueado;
}
function decirComoJarvis(texto) {   // lo que se escribe en el Manager aparece como si Jarvis lo dijera
  Voz.callar();
  const caja = burbuja('jarvis', ''), p = caja.firstChild, hab = Habla(), palabras = texto.split(/\s+/); let i = 0;
  vivo.texto = true;
  const paso = () => {
    if (i >= palabras.length) { hab.cerrar(); vivo.texto = false; return; }
    const t = (i ? ' ' : '') + palabras[i++]; p.textContent += t; pulsoTexto = Math.min(1, pulsoTexto + .35); abajo(); hab.poner(t); setTimeout(paso, 58);
  };
  paso();
}
if (esPantalla) {
  fetch('api/exhibicion').then(r => r.json()).then(aplicarExhibicion).catch(() => {});
  new EventSource('api/eventos').onmessage = m => {
    const d = JSON.parse(m.data); if (d.tipo !== 'orden') return;
    if (d.accion === 'exhibicion') aplicarExhibicion(d);
    else if (d.accion === 'callar') Voz.callar();
    else if (d.accion === 'decir') decirComoJarvis(d.texto);
    else if (d.accion === 'preguntar') preguntar(d.texto);
  };
}
refrescar();
</script>
