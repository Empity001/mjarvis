<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M-Jarvis · Mapa de conocimiento</title>
<style>
  :root { --fondo: #0d1117; --panel: #161b22; --borde: #2a313c; --texto: #e6e8eb; --tenue: #8b949e; --acento: #6aa9ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto);
    font: 14px system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; }
  #lienzo { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }

  /* Barra superior: cuenta de nodos y buscador con resultados. */
  #barra { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
  #barra > * { pointer-events: auto; }
  #cuenta { flex: 1; min-width: 0; color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  #busca { position: relative; width: min(260px, 46%); }
  #buscar { width: 100%; padding: 7px 10px; background: var(--panel); color: var(--texto);
    border: 1px solid var(--borde); border-radius: 8px; font: inherit; }
  #hallados { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--borde);
    border-radius: 8px; overflow: hidden; display: none; z-index: 4; }
  #hallados button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hallados button:hover, #hallados button:first-child { background: #1f2630; }
  #hallados button::before, .chip::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--c); margin-right: 7px; }

  /* Panel de notas: lo que hay dentro de los nodos elegidos, sobre el mapa y sin moverlo. */
  #izq { position: absolute; left: 12px; top: 54px; max-height: calc(100% - 70px); width: min(330px, calc(100% - 120px));
    display: none; flex-direction: column; background: rgba(22, 27, 34, .95); border: 1px solid var(--borde); border-radius: 10px; z-index: 3; }
  body.con-notas #izq { display: flex; }
  #izq header { display: flex; align-items: center; gap: 6px; padding: 9px 10px 9px 14px; border-bottom: 1px solid var(--borde); }
  #izq header b { flex: 1; font-size: 13px; }
  #acciones { display: none; gap: 6px; padding: 9px 12px 0; flex-wrap: wrap; }
  #izq.eleccion #acciones { display: flex; }
  .accion { background: none; border: 1px solid var(--borde); border-radius: 6px; padding: 4px 9px; font-size: 12.5px; }
  .accion:hover { border-color: var(--acento); }
  #notas { overflow-y: auto; padding: 10px 12px 12px; }
  #ruta { color: #c2c7ce; line-height: 1.5; margin: 0 0 10px; font-size: 13px; }
  .nota { border-left: 3px solid var(--c); padding: 2px 0 2px 10px; margin-bottom: 14px; }
  .nota small { color: var(--tenue); text-transform: uppercase; letter-spacing: .05em; font-size: 10.5px; }
  .nota h4 { margin: 2px 0 0; font-size: 15px; font-weight: 600; }
  .nota p { margin: 6px 0 8px; line-height: 1.45; color: #c2c7ce; }
  .nota .lazos { color: var(--tenue); font-size: 12px; margin-bottom: 5px; }
  .chip { display: inline-block; background: none; border: 1px solid var(--borde); border-radius: 12px;
    padding: 3px 10px; margin: 0 6px 6px 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:hover { border-color: var(--c); }
  .chip i { color: var(--tenue); font-style: normal; margin-left: 6px; font-size: 12px; }

  /* Herramientas del mapa, en columna. */
  #herr { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 2; }
  #herr button, #formas button { min-width: 78px; padding: 7px 10px; background: var(--panel); border: 1px solid var(--borde);
    border-radius: 8px; font-size: 12.5px; }
  #herr button:hover, #formas button:hover { border-color: var(--acento); }
  #herr button:active { transform: translateY(1px); }
  #herr button[aria-pressed="true"], #formas button[aria-pressed="true"] { border-color: var(--acento); color: #cfe2ff; background: #18263a; }
  #herr .signo { font-size: 17px; line-height: 1; padding: 6px 10px; }
  #formas { position: absolute; right: 100px; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 6px;
    background: var(--fondo); border: 1px solid var(--borde); border-radius: 10px; padding: 8px; z-index: 3; }
  body.menu-formas #formas { display: flex; }
  #aviso { position: absolute; left: 12px; bottom: 16px; display: none; align-items: center; gap: 10px; background: var(--panel);
    border: 1px solid var(--borde); border-radius: 8px; padding: 6px 8px 6px 12px; color: #c2c7ce; z-index: 2; }
  #pista { position: absolute; right: 100px; bottom: 16px; color: var(--tenue); font-size: 12px; pointer-events: none; text-align: right; }

  /* Panel de análisis. */
  aside { width: 300px; flex: none; background: var(--panel); border-left: 1px solid var(--borde); padding: 14px 16px; overflow-y: auto; }
  body.sin-der aside { display: none; }
  aside h3 { margin: 18px 0 8px; font-size: 13px; font-weight: 600; }
  aside h3:first-child { margin-top: 2px; }
  .tema { display: block; width: 100%; text-align: left; background: none; border: 1px solid var(--c);
    border-radius: 6px; padding: 7px 10px; margin-bottom: 8px; }
  .tema[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 18%, transparent); }
  .tema b { display: block; font-weight: 600; }
  .tira { display: inline-block; width: 44px; height: 6px; border-radius: 3px; background: var(--borde);
    vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .tira i { display: block; height: 100%; background: var(--c); }
  .tema span { color: var(--tenue); font-size: 12px; }
  #datos { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; color: #c2c7ce; }
  #datos dt { color: var(--tenue); }
  #datos dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

  /* Subtítulos de la conversación, para cuando el mapa va solo en una segunda pantalla. */
  #voz { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(720px, calc(100% - 240px));
    background: rgba(13, 17, 23, .86); border: 1px solid var(--borde); border-radius: 10px; padding: 12px 16px;
    opacity: 0; transition: opacity .4s; pointer-events: none; }
  #voz.visible { opacity: 1; }
  #voz small { color: var(--tenue); }
  #voz p { margin: 4px 0 0; font-size: 1.15em; line-height: 1.45; }

  /* Dentro de la interfaz de M-Jarvis el mapa va solo: sin análisis, sin barra y sin subtítulos. */
  body.embebido aside, body.embebido #barra, body.embebido #voz, body.embebido #pista, body.embebido [data-h="analisis"],
  body.embebido [data-h="completa"] { display: none; }
  body.embebido #izq { top: 10px; max-height: calc(100% - 26px); }
  body.embebido #herr button, body.embebido #formas button { min-width: 0; padding: 5px 8px; font-size: 12px; }
  body.embebido #formas { right: 84px; }
  .nota .apagada { margin: 0 0 6px; font-size: 12px; color: #f5a623; }
  /* Dentro del chat en un celular: solo los botones imprescindibles, para que se vea la red. */
  @media (max-width: 520px) { body.embebido [data-h="nombres"], body.embebido [data-h="hilos"] { display: none; } }
  @media (max-height: 560px) {
    #herr { gap: 4px; }
    #herr button, #formas button { min-width: 0; padding: 4px 8px; font-size: 11.5px; }
    #herr .signo { font-size: 14px; padding: 3px 8px; }
    #formas { right: 84px; }
  }
  @media (max-width: 860px) {
    aside { position: fixed; inset: 0 0 0 auto; width: min(300px, 86vw); z-index: 5; }
    #voz { width: calc(100% - 32px); bottom: 64px; }
    #pista { display: none; }
  }
</style>
</head>
<body>
<div id="lienzo">
  <canvas id="c"></canvas>
  <div id="barra">
    <div id="cuenta"></div>
    <div id="busca">
      <input id="buscar" type="search" placeholder="Buscar nodo…" aria-label="Buscar nodo" autocomplete="off">
      <div id="hallados"></div>
    </div>
  </div>
  <section id="izq" aria-label="Notas de los nodos elegidos">
    <header><b id="izqTitulo">Selección</b><button type="button" class="accion" id="izqCerrar" aria-label="Cerrar el panel de notas">Cerrar</button></header>
    <div id="acciones">
      <button type="button" class="accion" data-a="aislar" title="Deja a la vista solo estos nodos y sus conexiones">Solo esto</button>
      <button type="button" class="accion" data-a="ocultar" title="Quita estos nodos de la vista">Ocultar</button>
      <button type="button" class="accion" data-a="apagar" title="M-Jarvis deja de usar estas notas para responder. No se borran: se pueden volver a activar">Desactivar</button>
      <button type="button" class="accion" data-a="limpiar" title="Suelta la selección (tecla Esc)">Limpiar</button>
    </div>
    <div id="notas"></div>
  </section>
  <div id="formas" role="menu" aria-label="Forma del mapa">
    <button type="button" data-f="plano" title="Tecla 1">Plano</button>
    <button type="button" data-f="cerebro" title="Tecla 2">Cerebro</button>
    <button type="button" data-f="esfera" title="Tecla 3">Esfera</button>
    <button type="button" data-f="dona" title="Tecla 4">Dona</button>
    <button type="button" data-f="galaxia" title="Tecla 5">Galaxia</button>
    <button type="button" data-f="nubes" title="Tecla 6. Cada tema, en su propia nube">Nubes</button>
    <button type="button" data-f="cuerpo" title="Tecla 7. Una figura humana hecha con lo que sabe">Cuerpo</button>
  </div>
  <div id="herr">
    <button type="button" class="signo" data-h="acercar" aria-label="Acercar el mapa" title="Acercar (tecla +)">+</button>
    <button type="button" class="signo" data-h="alejar" aria-label="Alejar el mapa" title="Alejar (tecla -)">−</button>
    <button type="button" data-h="ajustar" title="Ver todo el mapa (tecla 0)">Ver todo</button>
    <button type="button" data-h="forma" aria-haspopup="menu" title="Plano o en 3D: cerebro, esfera, dona, galaxia, nubes, cuerpo">Forma</button>
    <button type="button" data-h="girar" aria-pressed="false" title="Gira solo, despacio (tecla G). Solo en 3D">Girar</button>
    <button type="button" data-h="nombres" aria-pressed="true" title="Mostrar u ocultar los nombres (tecla N)">Nombres</button>
    <button type="button" data-h="hilos" aria-pressed="true" title="Mostrar u ocultar las conexiones (tecla H)">Hilos</button>
    <button type="button" data-h="completa" title="Pantalla completa (tecla F)">Pantalla</button>
    <button type="button" data-h="analisis" aria-pressed="true" title="Temas, conceptos y cifras">Análisis</button>
  </div>
  <div id="aviso"><span id="avisoTexto"></span><button type="button" class="accion" id="mostrarTodo">Mostrar todo</button></div>
  <div id="pista"></div>
  <div id="voz" aria-live="polite"><small id="vozP"></small><p id="vozR"></p></div>
</div>
<aside>
  <h3>Temas principales</h3>
  <div id="temas"></div>
  <h3>Conceptos más influyentes</h3>
  <div id="top"></div>
  <h3>Cifras de la red</h3>
  <dl id="datos"></dl>
</aside>
<script>
if (location.search.includes('embebido')) document.body.classList.add('embebido');
const EMBEBIDO = document.body.classList.contains('embebido');
const PALETA = ['#5fd38d', '#f472d0', '#f5a623', '#e6d84a', '#6aa9ff', '#b48cf2', '#4fd1c5', '#ff7a6b', '#a3b1c2'];
// Las nubes de fuera del cerebro van cada una en un solo color: trato (-1) y otros universos (-2).
// Fuera del cerebro (que es solo Marvel) hay nubes: cada una es una bola aparte, con su color, su
// sitio (en radios del cerebro; arriba es Y negativa) y su nombre.
const NUBES = {
  '-1': { nombre: 'M-Jarvis', color: '#9fe8ff', centro: [1.2, -0.8], radio: 0.3 },  // cómo conversa: trato, charla y emociones
  '-2': { nombre: 'Otros universos', color: '#d8c9a8', centro: [-1.3, 0.72], radio: 0.4 },
  '-3': { nombre: 'Taller', color: '#b7f0a0', centro: [-1.2, -0.8], radio: 0.26 },
  // Preguntas que ya tienen respuesta escrita: se contestan desde aquí al instante; si no está aquí, se busca en el cerebro.
  '-4': { nombre: 'Preguntas resueltas', color: '#ffc98a', centro: [1.25, 0.76], radio: 0.3 },
  // Notas desactivadas: siguen existiendo, pero M-Jarvis no las usa. Salen del cerebro y esperan aquí.
  '-9': { nombre: 'Desactivadas', color: '#6b7584', centro: [-0.5, 1.3], radio: 0.17 },
};
const color = g => g < 0 ? NUBES[g].color : PALETA[g % PALETA.length];
const aPlano = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const cv = document.getElementById('c'), cx = cv.getContext('2d');
// El mapa quieto se pinta una vez en esta capa; los impulsos se animan encima sin repintarlo todo.
const capa = document.createElement('canvas'), cb = capa.getContext('2d');
let sucio = true;
let N = [], L = [], porId = {}, W = 0, H = 0, dpr = 1;
let cam = { x: 0, y: 0, k: 1 }, alpha = 1, corriendo = false, encuadre = true;
let hover = null, arrastre = null, paneo = null, giroMano = null, pulsado = null, filtro = '', tema = -1;
let encendidos = new Set();
// Nodos elegidos a mano (uno o varios), sus vecinos y, si son dos, el camino que los une.
let marcados = new Set(), aura = new Set(), ruta = [], aislado = null, izqCerrado = false;
// Lo que cada pantalla recuerda: forma, giro, nombres, hilos y si el panel de análisis está abierto.
let PREF = {};
try { PREF = JSON.parse(localStorage.getItem('mjarvis-mapa') || '{}'); } catch (e) {}
let forma = 'plano', giro = !!PREF.giro, nombres = PREF.nombres !== false, hilos = PREF.hilos !== false;
if (PREF.sinDer || innerWidth < 860) document.body.classList.add('sin-der');  // en pantallas estrechas el análisis empieza cerrado
function guardar() {
  try {
    localStorage.setItem('mjarvis-mapa', JSON.stringify({ forma, giro, nombres, hilos, sinDer: document.body.classList.contains('sin-der') }));
  } catch (e) {}
}

function medir() {
  dpr = window.devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight;
  cv.width = capa.width = W * dpr; cv.height = capa.height = H * dpr; sucio = true; despertar();
}

// ---- Las tres dimensiones ----
// En plano cada nodo vive en (x, y). En 3D tiene además un sitio fijo en la forma elegida (t3); al
// cambiar de forma viaja desde donde estaba (o3). La vista se gira con el ratón y se proyecta con
// perspectiva: lo que queda delante se ve más grande y más vivo.
const RADIO = 430, FOCAL = 1700;
let rot = { a: 0, b: 0 }, trans = 1, metaRot = null, metaCam = null, giroTrig = [1, 0, 1, 0], polvo = [];
const esPlano = () => forma === 'plano' && trans >= 1;
const suave = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function orientar() { giroTrig = [Math.cos(rot.a), Math.sin(rot.a), Math.cos(rot.b), Math.sin(rot.b)]; }
function lugar3(n) {
  const d = forma === 'plano' ? [n.x, n.y, 0] : n.t3;
  if (trans >= 1 || !n.o3) return d;
  const e = suave(trans), o = n.o3;
  return [o[0] + (d[0] - o[0]) * e, o[1] + (d[1] - o[1]) * e, o[2] + (d[2] - o[2]) * e];
}
function girado(X, Y, Z) {
  const [ca, sa, cb2, sb] = giroTrig, x1 = X * ca + Z * sa, z1 = -X * sa + Z * ca;
  const z2 = Y * sb + z1 * cb2, f = FOCAL / (FOCAL - z2);
  return [x1 * f, (Y * cb2 - z1 * sb) * f, z2, f];
}
function proyectar(n) {
  if (esPlano()) { n.qx = n.x; n.qy = n.y; n.z = 0; n.f = 1; return; }
  const p = lugar3(n), c = n.c3;
  // Las nubes de fuera no dan vueltas alrededor del cerebro: cada una gira sobre su propio centro
  // y se queda en su sitio de la pantalla, sin taparlo nunca.
  if (c && forma !== 'plano') {
    [n.qx, n.qy, n.z, n.f] = girado(p[0] - c[0], p[1] - c[1], p[2]);
    n.qx += c[0]; n.qy += c[1];
  } else [n.qx, n.qy, n.z, n.f] = girado(p[0], p[1], p[2]);
}
const aPantalla = n => { proyectar(n); return [(n.qx - cam.x) * cam.k + W / 2, (n.qy - cam.y) * cam.k + H / 2]; };
const aMundo = (px, py) => [(px - W / 2) / cam.k + cam.x, (py - H / 2) / cam.k + cam.y];
const visible = n => !n.oculto && (!aislado || aislado.has(n));

// Números al azar que salen siempre iguales: así la forma es la misma en todas las pantallas.
function azar(semilla) {
  return () => {
    semilla = semilla + 0x6D2B79F5 | 0;
    let t = Math.imul(semilla ^ semilla >>> 15, 1 | semilla);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// El cerebro, hecho de elipsoides: dos hemisferios, dos lóbulos temporales, cerebelo y tallo.
// (x de lado a lado, y hacia arriba, z hacia el frente; centro y radios.)
// Por cada hemisferio: el cuerpo, el lóbulo frontal (delante y algo más bajo), el occipital (atrás, en
// punta) y el temporal (debajo, hacia delante). Más los dos lóbulos del cerebelo, atrás y abajo.
const LOBULOS = [-1, 1].flatMap(s => [
  [s * 0.33, 0.2, -0.04, 0.31, 0.4, 0.66],
  [s * 0.3, 0.1, 0.5, 0.28, 0.33, 0.36],
  [s * 0.27, 0.12, -0.6, 0.25, 0.3, 0.3],
  [s * 0.43, -0.2, 0.2, 0.2, 0.17, 0.44],
  [s * 0.2, -0.4, -0.56, 0.25, 0.17, 0.24],
]);
function enCerebro(x, y, z) {
  let menor = 9;
  for (const [a, b, c, rx, ry, rz] of LOBULOS) {
    const v = ((x - a) / rx) ** 2 + ((y - b) / ry) ** 2 + ((z - c) / rz) ** 2;
    if (v < menor) menor = v;
  }
  // El tallo: un cilindro que baja desde el centro y se inclina hacia atrás, afinándose.
  if (y < -0.3 && y > -0.98) {
    const t = (-0.3 - y) / 0.68, radio = 0.105 - 0.035 * t, eje = -0.16 - 0.2 * t;
    const v = (x * x + (z - eje) ** 2) / (radio * radio);
    if (v < menor) menor = v;
  }
  return menor;
}
// Un punto al azar de la forma, en una esfera de radio 1 (o null si el intento cae fuera).
function candidatoDe(nombre, r) {
  if (nombre === 'esfera') {
    const y = r() * 2 - 1, rad = Math.sqrt(1 - y * y), ang = r() * 6.2832;
    return [Math.cos(ang) * rad, y, Math.sin(ang) * rad];
  }
  if (nombre === 'dona') {
    const u = r() * 6.2832, v = r() * 6.2832, d = 0.72 + 0.27 * Math.cos(v);
    if (r() > d / 0.99) return null;  // la cara de fuera tiene más superficie que la de dentro
    return [d * Math.cos(u), 0.27 * Math.sin(v), d * Math.sin(u)];
  }
  if (nombre === 'galaxia') {
    const rad = 0.08 + 0.94 * Math.sqrt(r()), brazo = Math.floor(r() * 3), ang = brazo * 2.0944 + rad * 4.4 + (r() - 0.5) * 0.7;
    return [Math.cos(ang) * rad, (r() - 0.5) * 0.34 * (1.15 - rad), Math.sin(ang) * rad];
  }
  // cerebro: solo la corteza, con la cisura entre los dos hemisferios y los surcos que la pliegan
  const x = (r() * 2 - 1) * 0.74, y = r() * 1.62 - 0.98, z = (r() * 2 - 1) * 0.92, v = enCerebro(x, y, z);
  if (v > 1 || v < 0.72) return null;
  if (y > -0.2 && Math.abs(x) < 0.04) return null;  // la cisura longitudinal
  // Surcos: franjas onduladas donde no hay neuronas. Solo en los hemisferios, no en el cerebelo ni el tallo.
  if (y > -0.3 && Math.abs(Math.sin(10.5 * z + 2.2 * Math.sin(6 * y) + 1.4 * Math.sin(5 * x))) < 0.16) return null;
  // El cerebelo es más fino: láminas horizontales muy juntas.
  if (y < -0.3 && z < -0.25 && Math.abs(Math.sin(34 * y + 4 * Math.sin(7 * x))) < 0.22) return null;
  return [x, y, z];
}
// Devuelve `cuantos` puntos de la forma, repartidos de modo que ninguno quede a menos de cierta
// distancia de otro: así las bolas caben sin tocarse. Devuelve también esa distancia mínima.
function puntos(nombre, cuantos, semilla) {
  const candidato = typeof nombre === 'function' ? (_, r) => nombre(r) : candidatoDe;  // una forma con nombre, o una pieza suelta
  // Las piezas sueltas (un brazo, un escudo) son mucho más pequeñas que una forma entera: se parte de
  // una distancia menor y se baja a pasos más largos, para no gastar rondas que no pueden salir.

function paso() {

      const salto = cubo.length > 24 ? Math.ceil(cubo.length / 24) : 1;

  cx.globalAlpha = hayFoco ? 0.22 : 0.85;

    if (ligero || hayFoco || !nombres || b.cuantos < 3 || x < -40 || x > W + 40 || y < -40 || y > H + 40) continue;
    cx.globalAlpha = 0.9; cx.fillStyle = color(b.grupo);

    lista.push({ n: b.jefe, texto: corto(b.jefe), tam: 11 + Math.min(6, Math.sqrt(b.cuantos)),

  letreros(cx);
}

// El nombre de cada nube, encima de ella: así se sabe qué es cada bola de fuera del cerebro.
function letreros(cx) {
  cx.font = '600 12.5px system-ui, "Segoe UI", sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'alphabetic';
  for (const [g, nube] of Object.entries(NUBES)) {
    if (forma === 'cuerpo' && g === '-1') continue;  // en la figura el trato es el corazón, y ya tiene su rótulo
    let x = 0, arriba = 1e9, cuantos = 0;
    for (const n of N) {
      if (n.grupo !== +g || !visible(n)) continue;

    cx.strokeText(`${nube.nombre} (${cuantos})`, x / cuantos, arriba - 12);
    cx.fillText(`${nube.nombre} (${cuantos})`, x / cuantos, arriba - 12);
  }
  if (forma !== 'plano' && trans >= 1 && (anillos.length || rotulos3.length)) {
    const k = cam.k, ox = W / 2 - cam.x * k, oy = H / 2 - cam.y * k, hay = hayEnfoque();
    cx.lineWidth = 1;

        px = r.x * k + ox; py = r.y * k + oy;

        cx.globalAlpha = 0.32; cx.strokeStyle = '#8fa3bd';
        cx.beginPath(); cx.moveTo(px + (r.lado === 'left' ? -6 : 6), py - 4); cx.lineTo(qx * k + ox, qy * k + oy); cx.stroke();
        cx.textAlign = r.lado; cx.fillStyle = '#d5e0ee';

        const [qx, qy] = girado(r.x, r.y, 0);

      }

      cx.globalAlpha = hay ? 0.45 : 0.92; cx.lineWidth = 4; cx.strokeStyle = '#0d1117';
      cx.strokeText(texto, px, py); cx.fillText(texto, px, py); cx.lineWidth = 1;
    }

}

// ---- La vista en 3D ----
// Sin charcos: cada nota es un punto de luz en la forma. Lo de delante se ve grande y vivo, lo de
// detrás pequeño y apagado; los hilos cruzan por dentro como el cableado de un cerebro.
// Mientras la vista se mueve (girar, arrastrar, acercar, acomodarse) se pinta lo justo; al soltar,
// el dibujo completo. Con miles de notas, es la diferencia entre ir fluido e ir a saltos.
let prisa = 0, relojCalma = 0;
const apurado = () => performance.now() < prisa || !!giroMano || !!paneo || trans < 1 || !!metaRot || !!metaCam;
function conPrisa(ms) {
  prisa = performance.now() + ms;
  clearTimeout(relojCalma); relojCalma = setTimeout(redibujar, ms + 30);
}
const CAPAS = [0.13, 0.3, 0.62, 1];  // opacidad de las bolas según lo lejos que quedan: del fondo al frente

function pintar3D(cx) {
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, H);
  orientar();
  const foco = hayEleccion(), hay = hayEnfoque(), z = Math.max(0.8, Math.min(cam.k * 1.45, 1.5));
  const ligero = apurado(), enGiro = giro && !ligero && N.length > 1200;
  const relacionados = new Set();
  for (const n of N) if (encendidos.has(n.id)) n.vecinos.forEach(v => { if (!encendidos.has(v.id)) relacionados.add(v); });
  const hondo = v => Math.max(0, Math.min(1, (v / RADIO + 1) / 2));  // 0 al fondo, 1 al frente
  const tejido = forma === 'cerebro' && trans >= 1;  // el cerebro se pinta como fibras y somas, no como bolas
  if (forma !== 'plano' && !tejido) {  // la silueta de la forma, en tres pasadas según la profundidad
    const tandas = [new Path2D(), new Path2D(), new Path2D()];
    for (const p of polvo) {
      const [qx, qy, pz] = girado(p[0], p[1], p[2]);
      tandas[Math.min(2, Math.floor(hondo(pz) * 3))].rect((qx - cam.x) * cam.k + W / 2, (qy - cam.y) * cam.k + H / 2, 1.5, 1.5);
    }
    cx.fillStyle = '#8fa3bd';
    tandas.forEach((t, i) => { cx.globalAlpha = (0.07 + 0.1 * i) * suave(trans) * (hay ? 0.5 : 1); cx.fill(t); });
  }
  // Cada bola mide lo que cabe en su hueco (r3), a escala real: al alejar se achican con la forma y
  // nunca se montan unas sobre otras.
  const vistos = [];
  for (const n of N) {
    if (!visible(n)) continue;
    [n.sx, n.sy] = aPantalla(n);
    n.luz = hondo(n.z);

    vistos.push(n);
  }

  // En movimiento no se pintan; girando solo, únicamente los de delante.
  const hebras = new Map(), fuertes = [];
  for (const l of L) {
    if (!visible(l.a) || !visible(l.b)) continue;
    const on = enlaceActivo(l), medio = !foco && (encendidos.has(l.a.id) || encendidos.has(l.b.id));
    if (on || medio) { fuertes.push([l, on]); continue; }
    if (!hilos || ligero) continue;
    const delante = l.a.z + l.b.z > 0 ? 1 : 0;
    if (enGiro && !delante) continue;
    const clave = l.a.grupo * 2 + delante;
    let t = hebras.get(clave);

    t.moveTo(l.a.sx, l.a.sy); t.lineTo(l.b.sx, l.b.sy);
  }
  cx.lineWidth = 1;
  // Con miles de hilos, cada uno pesa menos; y en la figura menos aún, para que no tapen la silueta.
  const tenue = (L.length > 2500 ? 0.55 : 1) * (forma === 'cuerpo' ? 0.45 : 1);
  for (const [clave, t] of hebras) {

    cx.globalAlpha = (hay ? 0.04 : (delante ? 0.2 : 0.07)) * tenue; cx.strokeStyle = color(Math.floor(clave / 2)); cx.stroke(t);
  }
  for (const [l, on] of fuertes) {

    cx.globalAlpha = on ? 0.9 : 0.4; cx.lineWidth = camino ? 3 : on ? 1.5 : 1; cx.strokeStyle = camino ? '#ffffff' : color(l.a.grupo);
    cx.beginPath(); cx.moveTo(l.a.sx, l.a.sy); cx.lineTo(l.b.sx, l.b.sy); cx.stroke();
  }

  // están en uso se pintan después, una a una y encima.
  const capas = CAPAS.map(() => new Map()), vivas = [], ocupado = [], lista = [];
  for (const n of vistos) {
    const on = activo(n), medio = !foco && relacionados.has(n);

    else {
      const capa = capas[Math.min(3, Math.floor(n.luz * 4))];
      let t = capa.get(n.grupo);
      if (!t) capa.set(n.grupo, t = new Path2D());
      t.moveTo(n.sx + n.sr, n.sy); t.arc(n.sx, n.sy, n.sr, 0, 6.283);
    }
    if ((n.z > 0 && n.sr > 2.5) || on) ocupado.push([n.sx - n.sr - 2, n.sy - n.sr - 2, n.sx + n.sr + 2, n.sy + n.sr + 2]);
    if (n.sx < -40 || n.sx > W + 40 || n.sy < -40 || n.sy > H + 40) continue;
    // Sin nada en uso, solo se nombran los de delante. En la figura, ninguno: ahí mandan los rótulos de las partes.
    if (!on && !medio && (hay || !nombres || n.z < RADIO * 0.25 || forma === 'cuerpo')) continue;
    lista.push({ n, x: n.sx, y: n.sy, r: n.sr, on, luz: on ? 1 : 0.6 + 0.4 * n.luz, texto: on ? n.id : corto(n),
      tam: Math.max(11, Math.min(18, n.fs * z * n.f * (0.8 + 0.2 * n.luz))) * (on ? 1.08 : 1),
      peso: (on ? 1000 : 0) + (n === hover || marcados.has(n) ? 500 : 0) + n.vecinos.size * (0.4 + n.luz) });
  }
  // Con miles de notas, la cara de atrás se deja casi apagada: se intuye la forma y no estorba a la de delante.
  const fondo = N.length > 1200 ? [0.05, 0.13, 0.6, 1] : CAPAS;
  capas.forEach((capa, i) => {
    cx.globalAlpha = hay ? Math.min(0.14, fondo[i]) : fondo[i];
    for (const [grupo, t] of capa) { cx.fillStyle = color(grupo); cx.fill(t); }
  });
  vivas.sort((a, b) => a[0].z - b[0].z);
  for (const [n, on] of vivas) {
    const r = Math.max(n.sr, on ? 3.2 : 2);  // lo que está en uso se ve aunque la vista esté lejos
    cx.globalAlpha = on ? 1 : 0.75; cx.fillStyle = color(n.grupo);
    cx.beginPath(); cx.arc(n.sx, n.sy, r, 0, 6.283); cx.fill();
    if (marcados.has(n) || encendidos.has(n.id)) { cx.globalAlpha = 1; cx.strokeStyle = '#fff'; cx.lineWidth = 2; cx.stroke(); }
  }
  rotular(cx, lista, ocupado, hay, ligero ? 10 : Math.round((enGiro ? 10 : 14) + 30 * Math.min(1, cam.k)));
  letreros(cx);
}

// ---- Charcos: la vista plana ----
// Cada nodo fundido aporta a un campo de densidad sobre una rejilla; las conexiones cortas aportan
// a lo largo de su recorrido, y por eso los cúmulos conectados se juntan. Del campo se sacan curvas
// de nivel (marching squares), como en un mapa topográfico, con el color del tema que domina cada zona.
// Los niveles son fracciones de la zona más densa: así siempre hay curvas por dentro, igual de
// cerca que de lejos, y no un simple borde.
const NIVELES = [0.05, 0.12, 0.21, 0.32, 0.45, 0.6, 0.78], OPACIDAD = [0.34, 0.44, 0.54, 0.64, 0.74, 0.84, 0.95];
// Para cada combinación de esquinas dentro del nivel, qué lados de la celda une la curva
// (0 arriba, 1 derecha, 2 abajo, 3 izquierda).
const CORTES = [[], [[3, 0]], [[0, 1]], [[3, 1]], [[1, 2]], [[3, 0], [1, 2]], [[0, 2]], [[3, 2]],
  [[3, 2]], [[0, 2]], [[0, 1], [3, 2]], [[1, 2]], [[3, 1]], [[0, 1]], [[3, 0]], []];

// Hasta qué largo (en pantalla) una conexión se dibuja como charcos que se juntan. De cerca solo las cortas.
const alcance = () => 216 / Math.pow(Math.max(1, cam.k / 0.6), 1.3);
const relleno = document.createElement('canvas'), tonos = {};
const rgb = g => tonos[g] || (tonos[g] = [1, 3, 5].map(i => parseInt(color(g).slice(i, i + 2), 16)));

function pintarCharcos(cx, hayFoco) {
  // En pantallas grandes la rejilla es algo más gruesa: el dibujo es el mismo y cuesta la mitad.
  const g = W * H > 1300000 ? 6 : W * H > 600000 ? 5 : 4, cols = Math.ceil(W / g) + 2, filas = Math.ceil(H / g) + 2;
  // De cerca el charco de cada nodo crece con el zoom; de lejos nunca baja de un mínimo, para que se junten.
  // Crece más despacio que el zoom: por eso al acercar los charcos se van separando en charquitos.
  const escala = 0.6 + (Math.max(0.6, Math.min(cam.k, 2.2)) - 0.6) * 0.25, puente = alcance();
  const total = cols * filas;
  const campo = new Float32Array(total), fuerte = new Float32Array(total), dueno = new Int16Array(total);
  const rojo = new Float32Array(total), verde = new Float32Array(total), azul = new Float32Array(total);
  const salpicar = (x, y, R, peso, grupo) => {
    const i0 = Math.max(0, Math.floor((x - R) / g)), i1 = Math.min(cols - 1, Math.ceil((x + R) / g));
    const j0 = Math.max(0, Math.floor((y - R) / g)), j1 = Math.min(filas - 1, Math.ceil((y + R) / g));
    const [cr, cg, cb] = rgb(grupo);
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const dx = i * g - x, dy = j * g - y, q = 1 - (dx * dx + dy * dy) / (R * R);
      if (q <= 0) continue;
      const v = peso * q * q, k = j * cols + i;
      campo[k] += v; rojo[k] += v * cr; verde[k] += v * cg; azul[k] += v * cb;
      if (v > fuerte[k]) { fuerte[k] = v; dueno[k] = grupo; }
    }
  };
  for (const n of N) {
    if (!n.charco) continue;
    const [x, y] = aPantalla(n);
    if (x > -60 && x < W + 60 && y > -60 && y < H + 60) salpicar(x, y, (22 + n.r * 2.6) * escala, 0.7 + Math.sqrt(n.vecinos.size) * 0.22, n.grupo);
  }
  for (const l of L) {  // el puente entre dos cúmulos conectados y cercanos
    if (!l.a.charco || !l.b.charco) continue;
    const [x1, y1] = aPantalla(l.a), [x2, y2] = aPantalla(l.b), largo = Math.hypot(x2 - x1, y2 - y1);
    if (largo < 24 || largo > puente) continue;
    const pasos = Math.ceil(largo / 22);
    for (let s = 1; s < pasos; s++) salpicar(x1 + (x2 - x1) * s / pasos, y1 + (y2 - y1) * s / pasos, 22, cam.k < 0.6 ? 0.42 : 0.6, l.a.grupo);
  }
  cx.lineWidth = 1.15; cx.lineJoin = 'round';
  let cima = 0;
  for (let k = 0; k < campo.length; k++) if (campo[k] > cima) cima = campo[k];
  // El relleno se pinta en una imagen pequeña (un punto por celda, con la mezcla de colores de los
  // nodos que la tocan) y se estira suavizada: así no se ven cuadritos ni saltos de color.
  // La orilla tiene tope: un nodo suelto siempre alcanza a tener su charquito, por denso que sea el resto.
  const borde = Math.max(0.5, Math.min(0.6, NIVELES[0] * cima));
  if (relleno.width !== cols || relleno.height !== filas) { relleno.width = cols; relleno.height = filas; }
  const cr = relleno.getContext('2d'), imagen = cr.createImageData(cols, filas), px = imagen.data;
  const base = hayFoco ? 0.07 : 0.3, extra = hayFoco ? 0.05 : 0.32;
  for (let k = 0; k < total; k++) {
    const v = campo[k];
    if (v <= borde * 0.8) continue;
    const p = k * 4, entrada = Math.min(1, (v - borde * 0.8) / (borde * 0.4));
    px[p] = rojo[k] / v; px[p + 1] = verde[k] / v; px[p + 2] = azul[k] / v;

  cx.drawImage(relleno, -g / 2, -g / 2, cols * g, filas * g);

  const cerca = cam.k >= 1;
  // Todas las curvas salen de una sola pasada por la rejilla: en cada celda solo se miran los
  // niveles que caen entre su esquina más baja y la más alta (casi siempre, ninguno).
  const curvas = [];
  NIVELES.forEach((fraccion, orden) => {
    if (cerca && orden % 3) return;
    curvas.push({ nivel: orden ? Math.max(borde + 0.1, fraccion * cima) : borde, orden, trazos: new Map() });
  });
  for (let j = 0; j < filas - 1; j++) for (let i = 0; i < cols - 1; i++) {
    const k = j * cols + i, a = campo[k], b = campo[k + 1], c = campo[k + cols + 1], d = campo[k + cols];
    const alto = Math.max(a, b, c, d);
    if (alto <= borde) continue;
    const bajo = Math.min(a, b, c, d);
    for (const curva of curvas) {
      const nivel = curva.nivel;
      if (nivel >= alto) break;  // los niveles van de menor a mayor
      if (nivel < bajo) continue;
      const caso = (a > nivel) | (b > nivel) << 1 | (c > nivel) << 2 | (d > nivel) << 3;
      if (caso === 0 || caso === 15) continue;
      const x = i * g, y = j * g, en = (p, q) => (nivel - p) / (q - p) * g;
      const lado = [[x + en(a, b), y], [x + g, y + en(b, c)], [x + en(d, c), y + g], [x, y + en(a, d)]];
      const grupo = dueno[fuerte[k] > fuerte[k + cols + 1] ? k : k + cols + 1];
      let trazo = curva.trazos.get(grupo);
      if (!trazo) curva.trazos.set(grupo, trazo = new Path2D());
      for (const [p, q] of CORTES[caso]) { trazo.moveTo(lado[p][0], lado[p][1]); trazo.lineTo(lado[q][0], lado[q][1]); }
    }
  }
  for (const curva of curvas) {
    cx.globalAlpha = hayFoco ? 0.16 : OPACIDAD[curva.orden] * (cerca && curva.orden ? 0.6 : 1);
    for (const [grupo, trazo] of curva.trazos) { cx.strokeStyle = color(grupo); cx.stroke(trazo); }
  }
  cx.globalAlpha = 1;
}

// ---- Impulsos: las "neuronas" conectándose mientras Jarvis busca y responde ----
const QUIETO = matchMedia('(prefers-reduced-motion: reduce)').matches;
let impulsos = [], destellos = [], modo = null, animando = false, ultimoCuadro = 0, ultimoBrote = 0;

function curva(l) {
  if (l.f && forma === 'cerebro' && trans >= 1) { proyectarFibra(l.f, l.fc); return Array.from(hebra); }  // el impulso viaja por la fibra
  const [x1, y1] = aPantalla(l.a), [x2, y2] = aPantalla(l.b), comba = esPlano() ? 0.16 : 0;
  return [x1, y1, (x1 + x2) / 2 - (y2 - y1) * comba, (y1 + y2) / 2 + (x2 - x1) * comba, x2, y2];
}
function puntoEn(c, t) {
  if (c.length > 6) {  // una fibra: tramos rectos encadenados
    const n = c.length / 2 - 1, u = Math.min(n - 1e-6, Math.max(0, t) * n), i = Math.floor(u), s = u - i;
    return [c[i * 2] + (c[i * 2 + 2] - c[i * 2]) * s, c[i * 2 + 1] + (c[i * 2 + 3] - c[i * 2 + 1]) * s];

function lanzar(l, desdeB, fuerte, espera) {
  impulsos.push({ l, desdeB, fuerte, t0: performance.now() + (espera || 0), dura: fuerte ? 650 : 900 });
}
// Onda de activación: de cada nodo encendido salen impulsos hacia sus vecinos.
function onda(ids) {
  let i = 0;
  for (const l of L) {
    const a = ids.includes(l.a.id), b = ids.includes(l.b.id);

// Los impulsos solo recorren relaciones reales de las notas que Jarvis está usando; si la pregunta

function brotar(ahora) {

    // Pensando: repasa una y otra vez todo lo relacionado con las notas encontradas.
    if (ahora - ultimoBrote > 1500) { ultimoBrote = ahora; onda([...encendidos]); }
  } else if (ahora - ultimoBrote > 380) {
    // Respondiendo: circula entre las notas que la respuesta va usando; si es una sola, hacia sus vecinas.
    const entre = L.filter(l => encendidos.has(l.a.id) && encendidos.has(l.b.id));
    const activos = entre.length ? entre : L.filter(l => encendidos.has(l.a.id) || encendidos.has(l.b.id));
    if (!activos.length) return;
    ultimoBrote = ahora;
    const l = activos[Math.floor(Math.random() * activos.length)];
    lanzar(l, entre.length ? Math.random() < 0.5 : !encendidos.has(l.a.id), true);

// Buscador: al escribir se iluminan los nodos que coinciden y sale una lista para saltar a uno.
const campoBuscar = document.getElementById('buscar'), hallados = document.getElementById('hallados');
function buscar() {
  filtro = aPlano(campoBuscar.value.trim());
  hallados.textContent = '';
  const lista = filtro ? N.filter(n => n.plano.includes(filtro)).sort((a, b) => b.vecinos.size - a.vecinos.size).slice(0, 8) : [];
  lista.forEach(n => {
    const b = document.createElement('button');
    b.type = 'button'; b.style.setProperty('--c', color(n.grupo)); b.textContent = n.id;
    b.addEventListener('click', () => ir(n));
    hallados.append(b);
  });
  hallados.style.display = lista.length ? 'block' : 'none';
  redibujar();
  return lista;
}
function ir(n) {
  campoBuscar.value = ''; buscar();
  if (!visible(n)) { n.oculto = false; if (aislado) aislado.add(n); avisar(); }
  marcar(n, true); centrar(n);
}
campoBuscar.addEventListener('input', buscar);
campoBuscar.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const lista = buscar(); if (lista.length) ir(lista[0]); }
  else if (e.key === 'Escape') { campoBuscar.value = ''; buscar(); campoBuscar.blur(); }
});

// Zoom y forma por botones, teclado u órdenes a Jarvis ("acerca el mapa", "ponlo en forma de cerebro").
const FORMAS = ['plano', 'cerebro', 'esfera', 'dona', 'galaxia', 'nubes', 'cuerpo'];
function zoomMapa(accion) {
  if (FORMAS.includes(accion)) return cambiarForma(accion);
  if (accion === 'girar' || accion === 'parar') { giro = accion === 'girar'; if (giro && forma === 'plano') cambiarForma('cerebro'); botones(); guardar(); mover(); return; }
  metaCam = null;
  if (accion === 'ajustar') { encuadre = true; for (let i = 0; i < 40; i++) encuadrar(); }
  else { encuadre = false; cam.k = Math.max(0.15, Math.min(4, cam.k * (accion === 'acercar' ? 1.35 : 1 / 1.35))); }
  redibujar();
}
window.zoomMapa = zoomMapa;
function botones() {
  const pone = (h, v) => document.querySelector(`[data-h="${h}"]`).setAttribute('aria-pressed', String(v));
  pone('girar', giro); pone('nombres', nombres); pone('hilos', hilos); pone('analisis', !document.body.classList.contains('sin-der'));
  document.querySelectorAll('#formas button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === forma)));
  document.getElementById('pista').textContent = forma === 'plano'
    ? 'Toque un nodo para elegirlo · arrastre para mover · rueda para acercar'
    : 'Arrastre para girar · Mayús + arrastre para mover · toque un nodo para elegirlo';
}
function herramienta(h) {
  if (h === 'acercar' || h === 'alejar' || h === 'ajustar') zoomMapa(h);
  else if (h === 'forma') { document.body.classList.toggle('menu-formas'); return; }
  else if (h === 'girar') zoomMapa(giro ? 'parar' : 'girar');
  else if (h === 'nombres') { nombres = !nombres; redibujar(); }
  else if (h === 'hilos') { hilos = !hilos; redibujar(); }
  else if (h === 'completa') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (h === 'analisis') { document.body.classList.toggle('sin-der'); medir(); }
  botones(); guardar();
}
document.getElementById('herr').addEventListener('click', e => { if (e.target.dataset.h) herramienta(e.target.dataset.h); });
document.getElementById('formas').addEventListener('click', e => { if (e.target.dataset.f) cambiarForma(e.target.dataset.f); });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.key.toLowerCase();
  if (t === '+' || t === '=') zoomMapa('acercar');
  else if (t === '-') zoomMapa('alejar');
  else if (t === '0') zoomMapa('ajustar');
  else if (t >= '1' && t <= '7') cambiarForma(FORMAS[+t - 1]);
  else if (t === 'g') herramienta('girar');
  else if (t === 'n') herramienta('nombres');
  else if (t === 'h') herramienta('hilos');
  else if (t === 'f') herramienta('completa');
  else if (t === 'escape') { document.body.classList.remove('menu-formas'); soltar(); }
  else if (t === '/') { e.preventDefault(); campoBuscar.focus(); }
  else if (forma !== 'plano' && t.startsWith('arrow')) {
    e.preventDefault();
    if (t === 'arrowleft') rot.a -= 0.12; else if (t === 'arrowright') rot.a += 0.12;
    else rot.b = Math.max(-1.45, Math.min(1.45, rot.b + (t === 'arrowup' ? 0.12 : -0.12)));
    redibujar();
  }
});

// Lo llamará Jarvis al responder: enciende los nodos por los que pasó la respuesta.
window.iluminar = ids => {
  const nuevos = (ids || []).filter(i => !encendidos.has(i));
  encendidos = new Set(ids || []); fichas(); redibujar();
  if (nuevos.length) { onda(nuevos); arrancar(); }
};

function panel(g) {
  const cajaT = document.getElementById('temas'), cajaC = document.getElementById('top');
  g.temas.forEach(t => nombreTema[t.id] = t.nombre);
  g.temas.filter(t => t.nodos >= 3).forEach(t => {  // una nota suelta no es un tema
    const b = document.createElement('button');
    b.className = 'tema'; b.type = 'button'; b.style.setProperty('--c', color(t.id)); b.setAttribute('aria-pressed', 'false');
    const titulo = document.createElement('b'); titulo.textContent = t.nombre;
    const detalle = document.createElement('span');
    const tira = document.createElement('span'); tira.className = 'tira';
    const parte = document.createElement('i'); parte.style.width = t.pct + '%'; tira.append(parte);
    detalle.append(tira, `${t.pct}% · ${t.nodos} nodos · ${t.clave.slice(1).join(', ')}`);
    b.append(titulo, detalle);
    b.addEventListener('click', () => {
      tema = tema === t.id ? -1 : t.id;
      cajaT.querySelectorAll('.tema').forEach(x => x.setAttribute('aria-pressed', 'false'));
      if (tema >= 0) b.setAttribute('aria-pressed', 'true');
      redibujar();
    });
    cajaT.append(b);
  });
  const saber = N.filter(n => n.grupo >= 0).sort((a, b) => b.vecinos.size - a.vecinos.size);
  saber.slice(0, 12).forEach(n => cajaC.append(chip(n, x => { marcar(x, true); centrar(x); }, String(n.vecinos.size))));
  const datos = document.getElementById('datos'), fuentes = new Set(saber.map(n => n.fuente).filter(Boolean));
  const fila = (nombre, valor) => {
    const dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = nombre; dd.textContent = valor; datos.append(dt, dd);
  };
  fila('Notas', saber.length); fila('Conexiones', g.enlaces.length); fila('Temas', g.temas.length);
  fila('Documentos', fuentes.size);
  fila('Conexiones por nota', saber.length ? (g.enlaces.length * 2 / saber.length).toFixed(1) : '0');
  fila('Notas sueltas', saber.filter(n => !n.vecinos.size).length);
  if (saber.length) fila('La más conectada', `${saber[0].id.slice(0, 22)} (${saber[0].vecinos.size})`);
  fila('Reglas de trato', N.filter(n => n.grupo === -1).length);
  fila('Otros universos', N.filter(n => n.grupo === -2).length);
  fila('Notas del taller', N.filter(n => n.grupo === -3).length);
}

// Dos redes en el mismo lienzo, sin conexiones entre ellas: la de conocimiento (lo que sabe) y,
// a su derecha, la de trato (cómo conversa). Cada una tiene su propio centro de gravedad.
const sinTrato = { nodos: [], enlaces: [] };
Promise.all([
  fetch('graph.json', { cache: 'no-store' }).then(r => r.json()),
  fetch('trato.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : sinTrato).catch(() => sinTrato),
]).then(([g, t]) => {
  // Cada tema nace en su propio sector para que el acomodo sea rápido y estable.
  // Con miles de notas el racimo inicial se abre en proporción: apretados, el acomodo se eterniza.
  const sectores = Math.max(g.temas.length, 1), lejos = 520 + Math.sqrt(g.nodos.length) * 34, ancho = Math.max(1, Math.sqrt(g.nodos.length / 500));
  N = g.nodos.map((n, i) => {
    const ang = (n.grupo / sectores) * 6.283 + ((i * 0.618) % 1) * 0.7, rad = (140 + Math.sqrt((i * 0.382) % 1) * 420) * ancho;
    if ((n.fuente || '').toLowerCase().startsWith('taller-'))  // lo del taller: su propia bola, arriba, fuera del cerebro
      return { ...n, grupo: -3, cx: -lejos * 0.75, cy: -lejos * 0.75, x: -lejos * 0.75 + Math.cos(i * 2.4) * (40 + (i % 41) * 5),
        y: -lejos * 0.75 + Math.sin(i * 2.4) * (40 + (i % 41) * 5), vx: 0, vy: 0, vecinos: new Set() };
    if (n.tipo === 'dato')  // preguntas resueltas: su propia bola, abajo a la derecha
      return { ...n, grupo: -4, cx: lejos * 0.8, cy: lejos * 0.7, x: lejos * 0.8 + Math.cos(i * 2.4) * (40 + (i % 53) * 5),
        y: lejos * 0.7 + Math.sin(i * 2.4) * (40 + (i % 53) * 5), vx: 0, vy: 0, vecinos: new Set() };
    if (n.tipo === 'otro universo')  // su propia nube, a la izquierda del cerebro
      return { ...n, grupo: -2, cx: -lejos, x: -lejos + Math.cos(i * 2.4) * (60 + (i % 97) * 4), y: Math.sin(i * 2.4) * (60 + (i % 97) * 4), vx: 0, vy: 0, vecinos: new Set() };
    return { ...n, cx: 0, x: Math.cos(ang) * rad, y: Math.sin(ang) * rad, vx: 0, vy: 0, vecinos: new Set() };
  });
  const conocidos = new Set(N.map(n => n.id));
  t.nodos.filter(n => !conocidos.has(n.id)).forEach((n, i) => N.push({ ...n, grupo: -1, cx: lejos,
    x: lejos + Math.cos(i * 2.4) * (40 + i * 5), y: Math.sin(i * 2.4) * (40 + i * 5), vx: 0, vy: 0, vecinos: new Set() }));
  N.forEach(n => porId[n.id] = n);
  L = g.enlaces.concat(t.enlaces).map(e => ({ a: porId[e.a], b: porId[e.b] })).filter(l => l.a && l.b);
  L.forEach(l => { l.a.vecinos.add(l.b); l.b.vecinos.add(l.a); });
  N.forEach(n => { n.r = 3.5 + Math.sqrt(n.vecinos.size) * 2; n.fs = 11 + Math.min(7, Math.sqrt(n.vecinos.size) * 1.5); n.plano = aPlano(n.id); n.f = 1; n.z = 0; });
  document.getElementById('cuenta').textContent = `Conocimiento: ${g.nodos.length} nodos · ${g.enlaces.length} conexiones · ${g.temas.length} temas` +
    (t.nodos.length ? ` — M-Jarvis: ${t.nodos.length} nodos de trato y emociones` : '');
  panel(g);
  lejosPlano = lejos;
  fetch('../api/desactivadas', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).then(ponerApagadas).catch(() => {});
  // Si esta pantalla se quedó en una forma 3D, vuelve a ella sin viaje.
  if (FORMAS.includes(PREF.forma) && PREF.forma !== 'plano') { forma = PREF.forma; formar(forma); rot = miradaDe(forma); }
  botones(); medir();
  if (giro) mover();
}).catch(() => { document.getElementById('cuenta').textContent = 'No se pudo cargar graph.json'; });
</script>
